<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronómetro de Navidad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#450a0a,#7f1d1d,#064e3b);color:#fff;padding:20px;text-align:center}
.emoji{font-size:4rem;margin-bottom:10px}
h1{font-size:2.2rem;margin-bottom:6px}
.sub{opacity:.8;margin-bottom:28px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:14px;width:100%;max-width:440px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr);max-width:680px}}
.box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:22px 10px;backdrop-filter:blur(8px)}
.num{display:block;font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;opacity:.75;margin-top:6px}
.msg{margin-top:24px;font-size:1.3rem;font-weight:700;display:none}
</style>
</head>
<body>
<div class="emoji">🎄</div>
<h1>Navidad</h1>
<p class="sub" id="fecha">25 de diciembre</p>
<div class="grid">
  <div class="box"><span class="num" id="d">00</span><div class="lbl">Días</div></div>
  <div class="box"><span class="num" id="h">00</span><div class="lbl">Horas</div></div>
  <div class="box"><span class="num" id="m">00</span><div class="lbl">Minutos</div></div>
  <div class="box"><span class="num" id="s">00</span><div class="lbl">Segundos</div></div>
</div>
<div class="msg" id="msg">¡Feliz Navidad! 🎅🎄</div>
<script>
function meta(){const n=new Date(),y=n.getFullYear(),t=new Date(y,11,25);return n>=t?new Date(y+1,11,25):t}
const objetivo=meta();
document.getElementById("fecha").textContent="25 de diciembre de "+objetivo.getFullYear();
function tick(){const diff=objetivo-new Date();if(diff<=0){["d","h","m","s"].forEach(id=>document.getElementById(id).textContent="00");document.getElementById("msg").style.display="block";return}
const sec=Math.floor(diff/1000);
document.getElementById("d").textContent=String(Math.floor(sec/86400)).padStart(2,"0");
document.getElementById("h").textContent=String(Math.floor(sec%86400/3600)).padStart(2,"0");
document.getElementById("m").textContent=String(Math.floor(sec%3600/60)).padStart(2,"0");
document.getElementById("s").textContent=String(sec%60).padStart(2,"0")}
tick();setInterval(tick,1000);
</script>
</body>
</html>
