<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva Festiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body id="app-body" class="min-h-screen w-full transition-colors duration-700 ease-in-out bg-gradient-to-br from-rose-950 via-red-900 to-emerald-950 text-white flex flex-col justify-between selection:bg-white/20 overflow-x-hidden">

    <div id="bg-glow" class="fixed inset-0 pointer-events-none opacity-30 transition-all duration-700 bg-[radial-gradient(circle_at_50%_30%,rgba(255,255,255,0.25),transparent_60%)]"></div>

    <header class="relative z-10 w-full max-w-2xl mx-auto pt-6 px-4 sm:pt-10">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-xs font-semibold tracking-widest uppercase text-white/70">En vivo</span>
            </div>
            <button id="btn-open-modal" type="button" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-xs sm:text-sm font-medium backdrop-blur-md border border-white/15 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                <span>Tu Fecha</span>
            </button>
        </div>

        <nav aria-label="Seleccionar festividad" class="grid grid-cols-3 sm:flex sm:justify-center gap-2 sm:gap-3 p-1.5 rounded-2xl bg-black/25 backdrop-blur-md border border-white/10 shadow-inner">
            <button data-event="christmas" type="button" class="event-tab flex flex-col sm:flex-row items-center justify-center gap-1.5 py-3 px-2 sm:px-5 rounded-xl font-semibold text-xs sm:text-sm transition-all duration-300 active:scale-95 bg-white text-red-950 shadow-md">
                <span class="text-lg sm:text-base">🎄</span>
                <span>Navidad</span>
            </button>
            <button data-event="newyear" type="button" class="event-tab flex flex-col sm:flex-row items-center justify-center gap-1.5 py-3 px-2 sm:px-5 rounded-xl font-semibold text-xs sm:text-sm text-white/80 hover:text-white hover:bg-white/10 transition-all duration-300 active:scale-95">
                <span class="text-lg sm:text-base">🎆</span>
                <span>Año Nuevo</span>
            </button>
            <button data-event="thanksgiving" type="button" class="event-tab flex flex-col sm:flex-row items-center justify-center gap-1.5 py-3 px-2 sm:px-5 rounded-xl font-semibold text-xs sm:text-sm text-white/80 hover:text-white hover:bg-white/10 transition-all duration-300 active:scale-95">
                <span class="text-lg sm:text-base">🦃</span>
                <span class="truncate max-w-full">A. de Gracias</span>
            </button>
            <button id="tab-custom" data-event="custom" type="button" class="event-tab hidden col-span-3 sm:col-span-1 flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-xl font-semibold text-xs sm:text-sm text-white/80 hover:text-white hover:bg-white/10 transition-all duration-300 active:scale-95">
                <span>✨</span>
                <span id="tab-custom-label" class="truncate max-w-[120px]">Mi Evento</span>
            </button>
        </nav>
    </header>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center w-full max-w-3xl mx-auto px-4 py-8 text-center">
        <div class="mb-6 sm:mb-10">
            <div id="event-emoji" class="text-6xl sm:text-7xl mb-3 animate-float inline-block drop-shadow-2xl select-none">
                🎄
            </div>
            <h1 id="event-title" class="text-3xl sm:text-5xl font-extrabold tracking-tight drop-shadow-sm">
                Navidad
            </h1>
            <p id="event-target-date" class="mt-2 text-sm sm:text-base font-medium text-white/75 bg-black/20 inline-block px-4 py-1 rounded-full border border-white/10">
                Cargando fecha...
            </p>
        </div>

        <div id="countdown-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-5 w-full max-w-2xl">
            <div class="group relative flex flex-col items-center justify-center p-5 sm:p-7 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl transition-transform duration-300 hover:-translate-y-1">
                <span id="days" class="font-mono text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tighter tabular-nums drop-shadow-md">00</span>
                <span class="mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest text-white/70">Días</span>
            </div>

            <div class="group relative flex flex-col items-center justify-center p-5 sm:p-7 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl transition-transform duration-300 hover:-translate-y-1">
                <span id="hours" class="font-mono text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tighter tabular-nums drop-shadow-md">00</span>
                <span class="mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest text-white/70">Horas</span>
            </div>

            <div class="group relative flex flex-col items-center justify-center p-5 sm:p-7 rounded-3xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl transition-transform duration-300 hover:-translate-y-1">
                <span id="minutes" class="font-mono text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tighter tabular-nums drop-shadow-md">00</span>
                <span class="mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest text-white/70">Minutos</span>
            </div>

            <div class="group relative flex flex-col items-center justify-center p-5 sm:p-7 rounded-3xl bg-white/15 backdrop-blur-xl border border-white/30 shadow-2xl transition-transform duration-300 hover:-translate-y-1">
                <span id="seconds" class="font-mono text-5xl sm:text-6xl md:text-7xl font-extrabold tracking-tighter tabular-nums text-amber-300 drop-shadow-md">00</span>
                <span class="mt-2 text-xs sm:text-sm font-bold uppercase tracking-widest text-white/80">Segundos</span>
            </div>
        </div>

        <div id="celebration-banner" class="hidden mt-8 p-6 rounded-3xl bg-white/20 backdrop-blur-xl border border-white/30 max-w-md w-full animate-bounce">
            <p id="celebration-text" class="text-xl sm:text-2xl font-extrabold">¡Ha llegado el momento! 🎉</p>
        </div>
    </main>

    <footer class="relative z-10 w-full max-w-2xl mx-auto pb-6 px-4 text-center">
        <p class="text-xs text-white/50 font-medium">
            Hora local de tu dispositivo • Actualización automática
        </p>
    </footer>

    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm transition-opacity">
        <div class="w-full max-w-md rounded-3xl bg-slate-900 border border-white/15 p-6 sm:p-8 text-white shadow-2xl transform transition-all">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <span>✨</span> Nueva Cuenta Regresiva
                </h2>
                <button id="btn-close-modal" type="button" class="p-2 rounded-full hover:bg-white/10 text-white/70 hover:text-white transition-colors" aria-label="Cerrar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <form id="custom-event-form" class="space-y-4">
                <div>
                    <label for="custom-name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                        Nombre del Evento
                    </label>
                    <input type="text" id="custom-name" required maxlength="30" placeholder="Ej. Mi Cumpleaños, Vacaciones..."
                        class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="custom-date" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                            Fecha
                        </label>
                        <input type="date" id="custom-date" required
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base">
                    </div>
                    <div>
                        <label for="custom-time" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                            Hora (Opcional)
                        </label>
                        <input type="time" id="custom-time" value="00:00"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base">
                    </div>
                </div>

                <p id="form-error" class="hidden text-xs text-rose-400 font-medium bg-rose-950/50 border border-rose-500/30 p-2.5 rounded-lg">
                    Por favor selecciona una fecha y hora futura.
                </p>

                <div class="pt-2 flex gap-3">
                    <button type="button" id="btn-cancel-modal" class="flex-1 py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold text-sm transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all active:scale-95">
                        Iniciar Cronómetro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const appBody = document.getElementById('app-body');
            const eventTitleEl = document.getElementById('event-title');
            const eventEmojiEl = document.getElementById('event-emoji');
            const eventTargetDateEl = document.getElementById('event-target-date');
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const celebrationBanner = document.getElementById('celebration-banner');
            const celebrationText = document.getElementById('celebration-text');

            const tabs = document.querySelectorAll('.event-tab');
            const tabCustom = document.getElementById('tab-custom');
            const tabCustomLabel = document.getElementById('tab-custom-label');

            const modal = document.getElementById('custom-modal');
            const btnOpenModal = document.getElementById('btn-open-modal');
            const btnCloseModal = document.getElementById('btn-close-modal');
            const btnCancelModal = document.getElementById('btn-cancel-modal');
            const customForm = document.getElementById('custom-event-form');
            const customNameInput = document.getElementById('custom-name');
            const customDateInput = document.getElementById('custom-date');
            const customTimeInput = document.getElementById('custom-time');
            const formError = document.getElementById('form-error');

            let currentEventKey = 'christmas';
            let customEventData = null;

            const themes = {
                christmas: {
                    title: 'Navidad',
                    emoji: '🎄',
                    bgClasses: ['from-rose-950', 'via-red-900', 'to-emerald-950'],
                    activeTabText: 'text-red-950',
                    celebration: '¡Feliz Navidad! 🎅🎄✨'
                },
                newyear: {
                    title: 'Año Nuevo',
                    emoji: '🎆',
                    bgClasses: ['from-slate-950', 'via-indigo-950', 'to-amber-950'],
                    activeTabText: 'text-indigo-950',
                    celebration: '¡Feliz Año Nuevo! 🥂🎆🎉'
                },
                thanksgiving: {
                    title: 'Día de Acción de Gracias',
                    emoji: '🦃',
                    bgClasses: ['from-amber-950', 'via-orange-900', 'to-stone-950'],
                    activeTabText: 'text-orange-950',
                    celebration: '¡Feliz Día de Acción de Gracias! 🍂🥧'
                },
                custom: {
                    title: 'Evento Especial',
                    emoji: '✨',
                    bgClasses: ['from-fuchsia-950', 'via-purple-900', 'to-slate-950'],
                    activeTabText: 'text-purple-950',
                    celebration: '¡Llegó tu fecha especial! 🎉✨'
                }
            };

            const allBgClasses = Object.values(themes).flatMap(t => t.bgClasses);
            const allActiveTabTexts = Object.values(themes).map(t => t.activeTabText);

            try {
                const saved = localStorage.getItem('festive_custom_event');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.timestamp && parsed.name) {
                        customEventData = {
                            name: parsed.name,
                            timestamp: parsed.timestamp,
                            dateObj: new Date(parsed.timestamp)
                        };
                        tabCustomLabel.textContent = customEventData.name;
                        tabCustom.classList.remove('hidden');
                    }
                }
            } catch (e) {
                console.warn('No se pudo leer almacenamiento local:', e);
            }

            function getThanksgivingDate(year) {
                const novFirst = new Date(year, 10, 1, 0, 0, 0);
                const dayOfWeek = novFirst.getDay();
                const daysToFirstThursday = (4 - dayOfWeek + 7) % 7;
                const fourthThursdayDay = 1 + daysToFirstThursday + 21;
                return new Date(year, 10, fourthThursdayDay, 0, 0, 0);
            }

            function getNextHolidayDate(type) {
                const now = new Date();
                const currentYear = now.getFullYear();

                if (type === 'christmas') {
                    const target = new Date(currentYear, 11, 25, 0, 0, 0);
                    return now >= target ? new Date(currentYear + 1, 11, 25, 0, 0, 0) : target;
                }
                if (type === 'newyear') {
                    const target = new Date(currentYear, 0, 1, 0, 0, 0);
                    return now >= target ? new Date(currentYear + 1, 0, 1, 0, 0, 0) : target;
                }
                if (type === 'thanksgiving') {
                    const target = getThanksgivingDate(currentYear);
                    return now >= target ? getThanksgivingDate(currentYear + 1) : target;
                }
                if (type === 'custom' && customEventData) {
                    return customEventData.dateObj;
                }
                return new Date(currentYear, 11, 25, 0, 0, 0);
            }

            function formatDateSpanish(date) {
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                };
                let formatted = date.toLocaleDateString('es-ES', options);
                formatted = formatted.charAt(0).toUpperCase() + formatted.slice(1);

                const hours = date.getHours();
                const mins = date.getMinutes();
                if (hours !== 0 || mins !== 0) {
                    const hh = String(hours).padStart(2, '0');
                    const mm = String(mins).padStart(2, '0');
                    formatted += ` • ${hh}:${mm}`;
                }
                return formatted;
            }

            function applyTheme(eventKey) {
                const theme = themes[eventKey] || themes.christmas;
                appBody.classList.remove(...allBgClasses);
                appBody.classList.add(...theme.bgClasses);

                eventEmojiEl.textContent = currentEventKey === 'custom' ? '✨' : theme.emoji;
                eventTitleEl.textContent = currentEventKey === 'custom' && customEventData
                    ? customEventData.name
                    : theme.title;

                tabs.forEach(tab => {
                    const isSelected = tab.dataset.event === eventKey;
                    tab.classList.remove('bg-white', 'shadow-md', 'text-white/80', 'hover:text-white', 'hover:bg-white/10', ...allActiveTabTexts);
                    if (isSelected) {
                        tab.classList.add('bg-white', 'shadow-md', theme.activeTabText);
                    } else {
                        tab.classList.add('text-white/80', 'hover:text-white', 'hover:bg-white/10');
                    }
                });
            }

            function updateCountdown() {
                const targetDate = getNextHolidayDate(currentEventKey);
                eventTargetDateEl.textContent = formatDateSpanish(targetDate);

                const diff = targetDate.getTime() - Date.now();
                if (diff <= 0) {
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    celebrationText.textContent = (themes[currentEventKey] || themes.christmas).celebration;
                    celebrationBanner.classList.remove('hidden');
                    return;
                }

                celebrationBanner.classList.add('hidden');
                const totalSeconds = Math.floor(diff / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                daysEl.textContent = String(days).padStart(2, '0');
                hoursEl.textContent = String(hours).padStart(2, '0');
                minutesEl.textContent = String(minutes).padStart(2, '0');
                secondsEl.textContent = String(seconds).padStart(2, '0');
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selected = tab.dataset.event;
                    if (selected === 'custom' && !customEventData) return;
                    currentEventKey = selected;
                    applyTheme(currentEventKey);
                    updateCountdown();
                });
            });

            function openModal() {
                formError.classList.add('hidden');
                if (!customDateInput.value) {
                    const tomorrow = new Date(Date.now() + 86400000);
                    customDateInput.value = tomorrow.toISOString().split('T')[0];
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }

            function closeModal() {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }

            btnOpenModal.addEventListener('click', openModal);
            btnCloseModal.addEventListener('click', closeModal);
            btnCancelModal.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            customForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = customNameInput.value.trim();
                const dateVal = customDateInput.value;
                const timeVal = customTimeInput.value || '00:00';

                if (!name || !dateVal) return;

                const [year, month, day] = dateVal.split('-').map(Number);
                const [hh, mm] = timeVal.split(':').map(Number);
                const chosenDate = new Date(year, month - 1, day, hh || 0, mm || 0, 0);

                if (isNaN(chosenDate.getTime()) || chosenDate.getTime() <= Date.now()) {
                    formError.classList.remove('hidden');
                    return;
                }

                formError.classList.add('hidden');
                customEventData = {
                    name,
                    timestamp: chosenDate.getTime(),
                    dateObj: chosenDate
                };

                try {
                    localStorage.setItem('festive_custom_event', JSON.stringify({
                        name: customEventData.name,
                        timestamp: customEventData.timestamp
                    }));
                } catch (err) {
                    console.warn('No se pudo guardar en localStorage:', err);
                }

                tabCustomLabel.textContent = customEventData.name;
                tabCustom.classList.remove('hidden');
                currentEventKey = 'custom';
                applyTheme('custom');
                updateCountdown();
                closeModal();
            });

            applyTheme(currentEventKey);
            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
