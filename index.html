            /**
             * Calcula el cuarto jueves de noviembre para un año dado (Día de Gracias en EE. UU.)
             */
            function getThanksgivingDate(year) {
                // El mes 10 en JS es Noviembre (0-indexado)
                const novFirst = new Date(year, 10, 1, 0, 0, 0);
                const dayOfWeek = novFirst.getDay(); // 0 = Domingo, 4 = Jueves
                // Días hasta el primer jueves
                const daysToFirstThursday = (4 - dayOfWeek + 7) % 7;
                // El cuarto jueves es 21 días después del primer jueves
                const fourthThursdayDay = 1 + daysToFirstThursday + 21;
                return new Date(year, 10, fourthThursdayDay, 0, 0, 0);
            }

            /**
             * Obtiene la próxima ocurrencia de una festividad
             */
            function getNextHolidayDate(type) {
                const now = new Date();
                const currentYear = now.getFullYear();

                    // Si ya pasó el 25 de diciembre este año, apuntar al próximo
                    if (now >= target) {

                    }
                } else if (type === 'newyear') {
                    // El próximo Año Nuevo siempre es el 1 de enero del año siguiente
                    target = new Date(currentYear + 1, 0, 1, 0, 0, 0);
                } else if (type === 'thanksgiving') {
                    target = getThanksgivingDate(currentYear);
                    if (now >= target) {
